<style>
:root{
  --brand-50:#eef2ff;--brand-100:#e0e7ff;--brand-500:#6366f1;--brand-600:#4f46e5;--brand-700:#4338ca;
  --accent:#d97706;--canvas:#f8fafc;--surface:#ffffff;
  --ink:#0f172a;--ink-soft:#475569;--ink-faint:#64748b;
  --success:#15803d;--warning:#b45309;--danger:#b91c1c;
  --radius-card:1rem;--radius-control:0.625rem;
  --font:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
html{font-family:var(--font);background:var(--canvas);color:var(--ink);-webkit-text-size-adjust:100%}
body{margin:0;line-height:1.5}
:focus-visible{outline:2px solid var(--brand-600);outline-offset:2px}
a{color:var(--brand-700)}
.wrap{max-width:48rem;margin:0 auto;padding:0 1.5rem}
.wrap-narrow{max-width:42rem;margin:0 auto;padding:0 1rem}
main.landing{display:flex;flex-direction:column;gap:2.5rem;padding-top:3.5rem;text-align:center}
@media(min-width:768px){main.landing{padding-top:5rem}}
.hero{display:flex;flex-direction:column;align-items:center;gap:1rem}
.hero .mark{width:72px;height:72px;border-radius:1rem;display:block}
h1{font-size:2.25rem;font-weight:700;color:var(--brand-700);margin:0}
.tagline{max-width:36rem;font-size:1.125rem;color:var(--ink-soft);margin:0}
.attribution{font-size:.875rem;font-weight:500;color:var(--ink-faint);margin:-.5rem 0 0;letter-spacing:.01em}
.pill{display:inline-block;background:var(--brand-50);border:1px solid var(--brand-100);color:var(--brand-700);
  border-radius:999px;padding:.3rem .85rem;font-size:.8rem;font-weight:500}
.cta-row{margin-top:.5rem;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:.75rem}
.btn{display:inline-block;border-radius:var(--radius-control);padding:.75rem 1.5rem;font-weight:500;text-decoration:none}
.btn-primary{background:var(--brand-600);color:#fff}
.btn-primary:hover{background:var(--brand-700)}
.btn-secondary{border:1px solid var(--brand-600);color:var(--brand-700);background:transparent}
.btn-secondary:hover{background:var(--brand-50)}
.note{font-size:.75rem;color:var(--ink-faint);margin:0}
h2{font-size:1.5rem;font-weight:700;margin:0 0 .75rem}
.section-copy{max-width:42rem;margin:0 auto 1rem;font-size:.875rem;line-height:1.65;color:var(--ink-soft)}
.card{background:var(--surface);border:1px solid rgba(100,116,139,.15);border-radius:var(--radius-card);
  padding:1.25rem;box-shadow:0 1px 2px rgba(15,23,42,.04)}
.card h3{margin:0 0 .25rem;font-size:1rem;font-weight:600}
.card p{margin:0;font-size:.875rem;color:var(--ink-soft)}
.grid3{display:grid;gap:1rem;text-align:left}
@media(min-width:768px){.grid3{grid-template-columns:repeat(3,1fr)}}
.price-card{max-width:28rem;margin:0 auto;text-align:left}
.price{font-size:1.875rem;font-weight:700;color:var(--brand-700);margin:.5rem 0}
.price small{font-size:.75rem;font-weight:500;color:var(--ink-faint);margin-left:.5rem;vertical-align:middle}
.price-card ul{margin:0 0 .75rem;padding:0;list-style:none;display:flex;flex-direction:column;gap:.25rem;
  font-size:.875rem;color:var(--ink-soft)}
.fine{font-size:.75rem;color:var(--ink-faint);margin:0}
.support-copy{max-width:36rem;margin:0 auto;font-size:.875rem;color:var(--ink-soft)}
/* beta interest form */
.form-card{max-width:34rem;margin:0 auto;text-align:left}
.form-lede{max-width:34rem;margin:0 auto 1rem;font-size:.875rem;color:var(--ink-soft);text-align:center}
.field{display:flex;flex-direction:column;gap:.3rem;margin-bottom:.9rem}
.field label{font-size:.8125rem;font-weight:600;color:var(--ink)}
.field .hint{font-weight:400;color:var(--ink-faint)}
.field input,.field select,.field textarea{font:inherit;font-size:.9375rem;color:var(--ink);background:var(--surface);
  border:1px solid rgba(100,116,139,.35);border-radius:var(--radius-control);padding:.6rem .7rem;width:100%}
.field textarea{min-height:5rem;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--brand-600);outline:2px solid var(--brand-600);outline-offset:1px}
.field-row{display:grid;gap:.9rem}
@media(min-width:560px){.field-row{grid-template-columns:1fr 1fr}}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.btn-submit{width:100%;border:0;cursor:pointer;font:inherit;font-size:1rem}
.btn-submit[disabled]{opacity:.6;cursor:progress}
.form-status{margin:.75rem 0 0;font-size:.875rem;min-height:1.25rem}
.form-status[data-state="error"]{color:var(--danger)}
.form-status[data-state="ok"]{color:var(--success);font-weight:500}
.form-fine{margin:.75rem 0 0;font-size:.75rem;color:var(--ink-faint)}
.form-done{text-align:center;padding:1rem 0}
.form-done h3{margin:0 0 .35rem;font-size:1.0625rem;color:var(--brand-700)}
.form-done p{margin:0;font-size:.875rem;color:var(--ink-soft)}
footer{margin-top:2.5rem;border-top:1px solid rgba(100,116,139,.12);padding:1.5rem 0 2rem;
  text-align:center;font-size:.75rem;color:var(--ink-faint)}
footer nav{margin-bottom:.75rem;display:flex;flex-wrap:wrap;justify-content:center;column-gap:1rem;row-gap:.5rem}
footer a{color:inherit;text-decoration:underline}
footer a:hover{color:var(--ink-soft)}
footer p{margin:.5rem 0 0}
/* subpages */
main.page{padding:2.5rem 0}
.page-title{font-size:1.5rem;font-weight:700;color:var(--ink);margin:0 0 .25rem}
.page-lede{font-size:.875rem;color:var(--ink-soft);margin:0 0 1rem}
.stack{display:flex;flex-direction:column;gap:1rem}
details{border:1px solid rgba(100,116,139,.15);border-radius:.75rem;padding:.25rem .75rem;margin:0}
details summary{min-height:2.75rem;display:flex;align-items:center;gap:.5rem;cursor:pointer;
  padding:.5rem 0;font-size:.875rem;font-weight:500;color:var(--ink);list-style:none}
details summary::-webkit-details-marker{display:none}
details summary::before{content:"\25B8";color:var(--brand-600);flex:none;transition:transform .15s}
details[open] summary::before{transform:rotate(90deg)}
details .answer{padding:0 0 .75rem;font-size:.875rem;line-height:1.65;color:var(--ink-soft)}
details .answer p{margin:0 0 .6rem}
details .answer p:last-child{margin-bottom:0}
details .answer a{color:var(--brand-700);text-decoration:underline}
.faq-items{display:flex;flex-direction:column;gap:.25rem}
.backline{margin-top:1rem;font-size:.875rem}
/* legal prose (mirrors the app's article styles) */
.prose{font-size:.875rem;line-height:1.65;color:var(--ink-soft)}
.prose h1{font-size:1.5rem;font-weight:700;color:var(--ink);margin:0 0 .75rem}
.prose h2{font-size:1.125rem;font-weight:600;color:var(--ink);margin:1.25rem 0 .5rem}
.prose p{margin:0 0 .75rem}
.prose ul{margin:0 0 .75rem;padding-left:1.25rem;list-style:disc}
.prose li{margin-bottom:.25rem}
.prose a{color:var(--brand-700);text-decoration:underline}
.prose blockquote{border-left:4px solid var(--warning);padding-left:.75rem;margin:0 0 .75rem;
  font-weight:500;color:var(--ink)}
.prose em{color:var(--ink-faint)}
.center-page{min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:1rem;text-align:center;padding:2rem 1rem}
</style>
</head>
